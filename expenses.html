<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부 · 도쿄 3박 4일</title>
<meta name="description" content="도쿄 여행 예산과 실제 지출 기록">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="shell.css?v=7">
<link rel="stylesheet" href="edit.css?v=7">
<script src="api.js?v=7"></script>
<script src="shell.js?v=7"></script>
<script src="edit.js?v=7"></script>
<script src="panels.js?v=7"></script>
<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f2f4f6; --surface-3:#e5e8eb;
  --line:#e5e8eb; --line-soft:#f2f4f6;
  --text:#191f28; --text-2:#4e5968; --text-3:#8b95a1; --text-4:#b0b8c1;
  --accent:#3182f6; --accent-bg:#e8f3ff;
  /* 차트 단일 계열 — dataviz 검증 통과(밝기밴드·채도·대비 PASS) */
  --bar:#3182f6;
  --good:#00b884; --warn:#e07800; --crit:#f04452;
  --radius:16px; --radius-sm:10px; --radius-xs:8px;
  --ease:cubic-bezier(.25,.8,.35,1);
  --shadow:0 4px 16px rgba(25,31,40,.10), 0 1px 3px rgba(25,31,40,.06);
}
:root[data-theme="dark"]{
  --bg:#17171c; --surface:#202027; --surface-2:#26262d; --surface-3:#2e2e36;
  --line:#2e2e36; --line-soft:#26262d;
  --text:#eaeaee; --text-2:#a0a0ab; --text-3:#7a7a86; --text-4:#5c5c66;
  --accent:#4593fc; --accent-bg:#1c2a3d;
  --bar:#4593fc;                       /* 다크 표면 기준으로 따로 고른 스텝 */
  --good:#1ec99b; --warn:#f0a63c; --crit:#ff6b78;
  --shadow:0 4px 16px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",
              "Malgun Gothic","Apple SD Gothic Neo",Roboto,"Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%;padding:0 0 60px;
  word-break:keep-all;overflow-wrap:anywhere;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit}
:where(button,a,input,select):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* ---------- 헤더 ---------- */
.top{position:sticky;top:0;z-index:10;padding:16px 0 14px;margin-bottom:8px;background:var(--bg)}
.top-in{display:flex;align-items:center;gap:12px}
.back{
  display:inline-flex;align-items:center;gap:5px;padding:9px 13px;border-radius:99px;
  background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);
  text-decoration:none;transition:.15s var(--ease);
}
.back:hover{color:var(--text)}
.back:active{transform:scale(.96)}
h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.5px}
.top p{margin:2px 0 0;font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.icon-btn{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius-sm);color:var(--text-3);transition:.15s}
.icon-btn:hover{background:var(--surface);color:var(--text)}

/* ---------- 카드 ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:12px}
.card > h2{
  margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:-.2px;color:var(--text-3);
  display:flex;align-items:center;gap:8px;
}
.card > h2 small{margin-left:auto;font-size:12px;font-weight:500;color:var(--text-4);font-variant-numeric:tabular-nums}

/* ---------- 총액 ---------- */
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero-main > b{display:block;font-size:38px;font-weight:700;letter-spacing:-1.6px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-main span{display:block;margin-top:5px;font-size:12.5px;color:var(--text-3);font-weight:500}
.hero-main span b{font-size:12.5px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.hero-krw{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.hero-krw b{display:block;font-size:17px;font-weight:700;letter-spacing:-.4px;color:var(--text-2)}
.hero-krw span{font-size:11.5px;color:var(--text-4);font-weight:500}

.meter{margin-top:20px}
.meter-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter-bar i{display:block;height:100%;border-radius:99px;transition:width .35s var(--ease),background .2s}
.meter-legend{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:13px;color:var(--text-2);font-weight:600}
.meter-legend #meterIcon{display:inline-flex}
.meter-legend b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-3)}
.meter-legend .rest{margin-left:auto;color:var(--text-3);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- 가로 막대 ---------- */
.bars{display:flex;flex-direction:column;gap:13px}
.bar-row{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:12px}
.bar-label{font-size:13px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.bar-label i{width:7px;height:7px;border-radius:99px;flex:0 0 auto}
.bar-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--bar);border-radius:99px;transition:width .35s var(--ease)}
.bar-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text);min-width:66px;text-align:right;line-height:1.35}
.bar-plan{font-size:11px;color:var(--text-4);font-variant-numeric:tabular-nums;font-weight:500}
.bar-row.over .bar-val{color:var(--crit)}

/* ---------- 입력 폼 ---------- */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.form .full{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-3)}
.field input,.field select{
  padding:13px 14px;border-radius:var(--radius-sm);border:0;
  background:var(--surface-2);font-size:14px;font-weight:500;transition:.15s;
}
.field input::placeholder{color:var(--text-4)}
.field input:focus,.field select:focus{outline:0;box-shadow:0 0 0 2px var(--accent) inset}
.submit{
  grid-column:1 / -1;padding:15px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;transition:.15s var(--ease);
}
.submit:hover{filter:brightness(1.06)}
.submit:active{transform:scale(.98)}

/* ---------- 목록 ---------- */
.daygroup + .daygroup{margin-top:20px}
.daygroup h3{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:8px}
.daygroup h3 i{width:7px;height:7px;border-radius:99px;flex:0 0 auto}
.daygroup h3 b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-3);font-weight:700}
.item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:7px}
.item-cat{font-size:11.5px;color:var(--text-3);font-weight:600;flex:0 0 auto;min-width:54px}
.item-name{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-pay{font-size:11px;color:var(--text-4);font-weight:500;flex:0 0 auto}
.item-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.item-del{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;color:var(--text-4);flex:0 0 auto;transition:.15s}
.item-del:hover{background:var(--crit);color:#fff}
.item-del:active{transform:scale(.9)}
.empty{padding:28px 0;text-align:center;color:var(--text-3);font-size:13.5px;font-weight:500}

/* ---------- 도구 ---------- */
.tools{display:flex;gap:7px;flex-wrap:wrap}
.tool{padding:10px 14px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2);transition:.15s var(--ease)}
.tool:hover{background:var(--surface-3);color:var(--text)}
.tool:active{transform:scale(.96)}
.rate{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-2);font-weight:500;flex-wrap:wrap}
.rate input{width:88px;padding:11px 13px;border-radius:var(--radius-sm);border:0;background:var(--surface-2);text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.rate input:focus{outline:0;box-shadow:0 0 0 2px var(--accent) inset}
.rate small{color:var(--text-4);font-size:12px}

/* 정산 대상 고르기 */
.share-pick{display:flex;gap:7px;flex-wrap:wrap}
.share-pick label{
  display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:99px;
  background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;
  transition:.15s var(--ease);
}
.share-pick input{position:absolute;opacity:0;width:0;height:0}
.share-pick label:has(input:checked){background:var(--accent-bg);color:var(--accent)}
.share-pick label:active{transform:scale(.96)}

@media (max-width:520px){
  .wrap{padding:0 13px}
  .form{grid-template-columns:1fr}
  .bar-row{grid-template-columns:58px 1fr auto}
  .hero-main > b{font-size:32px}
  .card{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-in">
      <button class="icon-square" data-shell-menu aria-label="메뉴 열기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="back" href="index.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
        일정
      </a>
      <div>
        <h1>가계부</h1>
        <p>도쿄 3박 4일 · 10.08 – 10.11</p>
      </div>
      <button class="icon-btn" id="themeBtn" title="라이트/다크 전환" aria-label="라이트/다크 전환">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 총액 + 예산 게이지 -->
  <section class="card">
    <h2>총 지출<small id="rateNote"></small></h2>
    <div class="hero">
      <div class="hero-main">
        <b id="totalJpy">¥0</b>
        <span>계획 예산 <b id="planJpy">¥47,500</b></span>
      </div>
      <div class="hero-krw">
        <b id="totalKrw">₩0</b>
        <span>원화 환산</span>
      </div>
    </div>

    <div class="meter">
      <div class="meter-bar"><i id="meterFill" style="width:0%"></i></div>
      <div class="meter-legend">
        <span id="meterIcon" aria-hidden="true"></span>
        <span id="meterLabel">예산 내</span>
        <b id="meterPct">0%</b>
        <span class="rest" id="meterRest"></span>
      </div>
    </div>
  </section>

  <!-- 일자별 -->
  <section class="card">
    <h2>일자별 지출<small>계획 대비</small></h2>
    <div class="bars" id="dayBars"></div>
  </section>

  <!-- 분류별 -->
  <section class="card">
    <h2>분류별 지출</h2>
    <div class="bars" id="catBars"></div>
  </section>

  <!-- 입력 -->
  <section class="card">
    <h2>지출 추가</h2>
    <form class="form" id="addForm">
      <div class="field">
        <label for="fDay">날짜</label>
        <select id="fDay"></select>
      </div>
      <div class="field">
        <label for="fCat">분류</label>
        <select id="fCat"></select>
      </div>
      <div class="field full">
        <label for="fName">내용</label>
        <input id="fName" type="text" placeholder="예: 이치란 라멘" maxlength="60" required>
      </div>
      <div class="field">
        <label for="fAmt">금액 (¥)</label>
        <input id="fAmt" type="number" inputmode="numeric" min="0" step="10" placeholder="1190" required>
      </div>
      <div class="field" id="payerWrap" hidden>
        <label for="fPayer">낸 사람</label>
        <select id="fPayer"></select>
      </div>
      <div class="field full" id="shareWrap" hidden>
        <label>나눠 낼 사람</label>
        <div class="share-pick" id="sharePick"></div>
      </div>
      <div class="field">
        <label for="fPay">결제수단</label>
        <select id="fPay">
          <option value="현금">현금</option>
          <option value="카드">카드</option>
          <option value="IC">IC (Suica)</option>
        </select>
      </div>
      <button class="submit" type="submit">추가</button>
    </form>
  </section>

  <!-- 내역 -->
  <section class="card">
    <h2>내역<small id="itemCount"></small></h2>
    <div id="list"></div>
  </section>

  <!-- 설정 -->
  <section class="card">
    <h2>설정</h2>
    <div class="rate">
      <label for="fRate">환율 100엔 =</label>
      <input id="fRate" type="number" min="0" step="1" value="930">원
      <small>오프라인에서도 쓰도록 직접 입력합니다</small>
    </div>
    <div class="tools" style="margin-top:14px">
      <button class="tool" id="btnExport">JSON 내보내기</button>
      <button class="tool" id="btnImport">가져오기</button>
      <button class="tool" id="btnClear">전체 삭제</button>
      <input type="file" id="fileInput" accept="application/json" hidden>
    </div>
  </section>
</div>

<script>
/* ============================================================================
   데이터
   ========================================================================== */
const DAYS = [
  { label:"Day 1", date:"10.08 (목)", color:"#f04452", plan:14000 },
  { label:"Day 2", date:"10.09 (금)", color:"#e07800", plan:14000 },
  { label:"Day 3", date:"10.10 (토)", color:"#7c5cff", plan:16000 },
  { label:"Day 4", date:"10.11 (일)", color:"#00a98f", plan:3500  },
];
const CATS = ["식비", "교통", "쇼핑", "입장·체험", "숙박", "기타"];

const STORE = "tokyoTrip.expenses";
const RATE_STORE = "tokyoTrip.rate";
const THEME_STORE = "tokyoTrip.theme";     /* 일정 페이지와 같은 키를 써서 테마가 이어진다 */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const yen = n => "¥" + Math.round(n).toLocaleString("ko-KR");
const won = n => "₩" + Math.round(n).toLocaleString("ko-KR");

let items = [];
try { items = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch {}
let rate = 930;
try { rate = Number(localStorage.getItem(RATE_STORE)) || 930; } catch {}

const saveLocal = () => { try { localStorage.setItem(STORE, JSON.stringify(items)); } catch {} };
const save = saveLocal;

/* ---------------------------------------------------------------------------
   서버가 붙어 있으면 지출을 서버에 저장하고, 아니면 이 브라우저에만 남긴다.
   여행 중 데이터가 끊겨도 기록은 계속할 수 있어야 하므로 폴백을 유지한다.
   --------------------------------------------------------------------------- */
const online = () => typeof API !== "undefined" && API.isOnline() && !!API.state.user;
let dayIds = [];          // 화면의 0~3 인덱스 ↔ 서버 dayId
let members = [];         // 동행자 (낸 사람 · 나눠 낼 사람 선택용)

const toLocal = e => ({
  id: e.id,
  day: Math.max(0, dayIds.indexOf(e.dayId)),
  cat: e.cat || "기타", name: e.name, amt: e.amount, pay: e.pay || "현금",
  payerId: e.payerId, share: e.share || []
});

async function pullFromServer() {
  const [trip, ex, mm] = await Promise.all([
    API.get("/api/trip"), API.get("/api/expenses"), API.get("/api/members")
  ]);
  dayIds = trip.days.map(d => d.id);
  members = mm.members;
  /* 날짜 이름·계획 예산도 서버 값을 따른다 */
  trip.days.forEach((d, i) => {
    if (!DAYS[i]) return;
    DAYS[i].label = d.label || DAYS[i].label;
    DAYS[i].date  = d.date  || DAYS[i].date;
    DAYS[i].color = d.color || DAYS[i].color;
  });
  items = ex.expenses.map(toLocal);
}
const PLAN_TOTAL = DAYS.reduce((a, d) => a + d.plan, 0);

/* ============================================================================
   렌더
   ========================================================================== */
function renderTotals() {
  const total = items.reduce((a, i) => a + i.amt, 0);
  const pct = PLAN_TOTAL ? total / PLAN_TOTAL * 100 : 0;

  $("#totalJpy").textContent = yen(total);
  $("#planJpy").textContent  = yen(PLAN_TOTAL);
  $("#totalKrw").textContent = won(total * rate / 100);
  $("#rateNote").textContent = `100엔 = ${rate.toLocaleString("ko-KR")}원`;

  /* 상태색은 아이콘 + 라벨과 함께만 쓴다 — 색만으로 의미를 나르지 않는다 */
  /* 상태는 색만으로 나르지 않는다 — 아이콘 + 라벨을 항상 같이 붙인다 */
  const ICON = {
    over: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/></svg>',
    near: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    ok:   '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5.5 5.5L20 7"/></svg>'
  };
  const st = pct > 100 ? { c:"var(--crit)", i:ICON.over, t:"예산 초과" }
           : pct >= 80 ? { c:"var(--warn)", i:ICON.near, t:"예산 임박" }
           :             { c:"var(--good)", i:ICON.ok,   t:"예산 내"   };
  $("#meterFill").style.width = Math.min(100, pct) + "%";
  $("#meterFill").style.background = st.c;
  $("#meterIcon").innerHTML = st.i;
  $("#meterIcon").style.color = st.c;
  $("#meterLabel").textContent = st.t;
  $("#meterLabel").style.color = st.c;
  $("#meterPct").textContent = Math.round(pct) + "%";
  const rest = PLAN_TOTAL - total;
  $("#meterRest").textContent = rest >= 0 ? `${yen(rest)} 남음` : `${yen(-rest)} 초과`;
}

/* 단일 계열 가로 막대. 값이 적으므로 전 항목 직접 라벨. */
function renderBars(el, rows, showPlan) {
  const max = Math.max(1, ...rows.map(r => Math.max(r.value, showPlan ? r.plan : 0)));
  el.innerHTML = rows.map(r => {
    const over = showPlan && r.plan && r.value > r.plan;
    return `<div class="bar-row${over ? " over" : ""}">
      <span class="bar-label">${r.color ? `<i style="background:${r.color}"></i>` : ""}<span>${esc(r.label)}</span></span>
      <span class="bar-track" title="${esc(r.label)} — ${yen(r.value)}${showPlan && r.plan ? ` (계획 ${yen(r.plan)})` : ""}">
        <i style="width:${r.value / max * 100}%"></i>
      </span>
      <span class="bar-val">${yen(r.value)}${showPlan && r.plan ? `<br><span class="bar-plan">/ ${yen(r.plan)}</span>` : ""}</span>
    </div>`;
  }).join("");
}

function renderCharts() {
  renderBars($("#dayBars"), DAYS.map((d, i) => ({
    label: d.label, color: d.color, plan: d.plan,
    value: items.filter(x => x.day === i).reduce((a, x) => a + x.amt, 0)
  })), true);

  const catRows = CATS.map(c => ({
    label: c,
    value: items.filter(x => x.cat === c).reduce((a, x) => a + x.amt, 0)
  })).filter(r => r.value > 0).sort((a, b) => b.value - a.value);

  $("#catBars").innerHTML = "";
  if (!catRows.length) $("#catBars").innerHTML = `<div class="empty">아직 기록이 없습니다</div>`;
  else renderBars($("#catBars"), catRows, false);
}

function renderList() {
  const el = $("#list");
  $("#itemCount").textContent = items.length ? `${items.length}건` : "";
  if (!items.length) { el.innerHTML = `<div class="empty">지출을 추가하면 여기 쌓입니다</div>`; return; }

  el.innerHTML = DAYS.map((d, di) => {
    const rows = items.map((x, idx) => ({ ...x, idx })).filter(x => x.day === di);
    if (!rows.length) return "";
    const sum = rows.reduce((a, x) => a + x.amt, 0);
    return `<div class="daygroup">
      <h3><i style="background:${d.color}"></i>${d.label} · ${d.date}<b>${yen(sum)}</b></h3>
      ${rows.map(x => `<div class="item">
        <span class="item-cat">${esc(x.cat)}</span>
        <span class="item-name">${esc(x.name)}</span>
        <span class="item-pay">${esc(x.pay)}</span>
        <span class="item-amt">${yen(x.amt)}</span>
        <button class="item-del" data-idx="${x.idx}" aria-label="${esc(x.name)} 삭제" title="삭제">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>`).join("")}
    </div>`;
  }).join("");

  el.querySelectorAll(".item-del").forEach(b => b.onclick = async () => {
    const idx = Number(b.dataset.idx);
    const row = items[idx];
    if (online() && row?.id) {
      try { await API.del("/api/expenses/" + row.id); }
      catch (err) { return Edit.toast(err.message, true); }
    }
    items.splice(idx, 1);
    if (!online()) saveLocal();
    renderAll();
  });
}

const renderAll = () => { renderTotals(); renderCharts(); renderList(); };

/* ============================================================================
   입력 · 도구 · 테마
   ========================================================================== */
DAYS.forEach((d, i) => $("#fDay").add(new Option(`${d.label} · ${d.date}`, i)));
CATS.forEach(c => $("#fCat").add(new Option(c, c)));

/* 오늘이 여행 기간이면 그 날짜를 기본 선택 */
(() => {
  const iso = ["2026-10-08","2026-10-09","2026-10-10","2026-10-11"];
  const n = new Date();
  const today = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
  const i = iso.indexOf(today);
  if (i >= 0) $("#fDay").value = String(i);
})();

$("#addForm").addEventListener("submit", async e => {
  e.preventDefault();
  const amt = Number($("#fAmt").value);
  const name = $("#fName").value.trim();
  if (!name || !(amt >= 0)) return;
  const day = Number($("#fDay").value);
  const payerId = $("#fPayer")?.value || undefined;
  const share = [...document.querySelectorAll(".share-pick input:checked")].map(i => i.value);
  const row = { day, cat: $("#fCat").value, name, amt, pay: $("#fPay").value, payerId, share };

  if (online()) {
    try {
      const res = await API.post("/api/expenses", {
        dayId: dayIds[day], name, amount: amt, cat: row.cat, pay: row.pay,
        payerId, share
      });
      items.push(toLocal(res.expense));
    } catch (err) { Edit.toast(err.message, true); return; }
  } else {
    items.push(row);
    saveLocal();
  }
  renderAll();
  $("#fName").value = ""; $("#fAmt").value = ""; $("#fName").focus();
});

$("#fRate").value = rate;
$("#fRate").addEventListener("input", e => {
  rate = Number(e.target.value) || 0;
  try { localStorage.setItem(RATE_STORE, String(rate)); } catch {}
  if (online()) { API.patch("/api/settings", { rate }).catch(() => {}); }
  renderTotals();
});

$("#btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify({ rate, items }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tokyo-expenses.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("#btnImport").onclick = () => $("#fileInput").click();
$("#fileInput").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (Array.isArray(data.items)) { items = data.items; save(); }
    if (data.rate) { rate = Number(data.rate); $("#fRate").value = rate; localStorage.setItem(RATE_STORE, String(rate)); }
    renderAll();
  } catch { alert("읽을 수 없는 파일입니다."); }
  e.target.value = "";
});
$("#btnClear").onclick = async () => {
  if (!items.length) return;
  if (!confirm(`기록 ${items.length}건을 모두 지웁니다. 되돌릴 수 없습니다.`)) return;
  if (online()) {
    for (const row of items.filter(r => r.id)) {
      try { await API.del("/api/expenses/" + row.id); } catch {}
    }
  }
  items = []; saveLocal(); renderAll();
};

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_STORE, t); } catch {}
}
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_STORE); } catch {}
setTheme(savedTheme === "dark" ? "dark" : "light");
$("#themeBtn").onclick = () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

renderAll();

/* ---------- 공통 셸 · 서버 적재 ---------- */
function renderPayerAndShare() {
  const wrapP = $("#payerWrap"), wrapS = $("#shareWrap");
  if (!online() || members.length < 2) { wrapP.hidden = true; wrapS.hidden = true; return; }
  wrapP.hidden = false; wrapS.hidden = false;

  $("#fPayer").innerHTML = members
    .map(m => `<option value="${m.id}"${m.id === API.state.user.id ? " selected" : ""}>${esc(m.name)}</option>`).join("");
  $("#sharePick").innerHTML = members
    .map(m => `<label><input type="checkbox" value="${m.id}" checked>${esc(m.name)}</label>`).join("");
}

Shell.init({ page: "expenses", title: "도쿄 3박 4일" }).then(async shell => {
  if (shell.blocked) return;
  if (online()) {
    try {
      await pullFromServer();
      try { rate = (await API.get("/api/settings")).rate ?? rate; } catch {}
      $("#fRate").value = rate;
    } catch (e) { Edit.toast("가계부를 불러오지 못했습니다: " + e.message, true); }
  }
  renderPayerAndShare();
  renderAll();
});

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
