server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── API 리버스 프록시 ────────────────────────────────────────────────
    # 도커 내부 DNS(127.0.0.11)로 api 컨테이너를 찾습니다.
    # proxy_pass 에 변수를 쓰면 nginx 가 시작할 때 한 번만 해석하지 않고
    # 매번 다시 찾아서, api 컨테이너를 재시작해도 502 가 나지 않습니다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api http://api:8787;
        proxy_pass $api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 로그인 응답의 Set-Cookie 가 캐시되면 안 됩니다.
        proxy_no_cache      1;
        proxy_cache_bypass  1;
        add_header Cache-Control "no-store" always;
    }

    # HTML 은 캐시하지 않음 — 재배포하면 바로 반영되도록
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 서비스 워커는 절대 캐시하면 안 됨. 캐시되면 새 버전이 영영 안 깔린다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 키 파일도 캐시하지 않음
    location = /gmaps-key.local.js {
        add_header Cache-Control "no-store";
    }

    # 아이콘은 오래 캐시해도 안전
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json text/html image/svg+xml;
    gzip_vary         on;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
