services:
  # ── 정적 페이지 (일정·가계부) + /api 리버스 프록시 ─────────────────────
  tokyo-trip:
    build: .
    image: tokyo-trip:latest
    container_name: tokyo-trip
    restart: unless-stopped
    networks: [tokyo-net]
    depends_on: [api]
    expose:
      - "80"

    # Cloudflare 터널을 붙인 뒤에는 이 두 줄을 지워도 됩니다.
    # (터널만 쓰면 서버에 포트를 하나도 열 필요가 없습니다)
    ports:
      - "8080:80"

    # ── 지도 키를 서버에 두고 싶을 때만 주석 해제 ────────────────────────
    # 키는 이미지에 굽지 않습니다(.dockerignore). 서버에서 직접 만드세요:
    #   cp gmaps-key.local.js.example gmaps-key.local.js
    # CentOS 는 SELinux 때문에 :ro,Z 가 반드시 필요합니다.
    #
    # volumes:
    #   - ./gmaps-key.local.js:/usr/share/nginx/html/gmaps-key.local.js:ro,Z

    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── API 서버 (로그인·장소·가계부·정산) ─────────────────────────────────
  api:
    build:
      # seed 가 index.html 을 읽어야 해서 컨텍스트를 저장소 루트로 둡니다
      context: .
      dockerfile: server/Dockerfile
    image: tokyo-trip-api:latest
    container_name: tokyo-trip-api
    restart: unless-stopped
    networks: [tokyo-net]
    expose:
      - "8787"
    env_file:
      - .env
    environment:
      # 터널/nginx 뒤에서 HTTPS 로 서비스되므로 세션 쿠키에 Secure 를 붙입니다.
      SECURE_COOKIE: "1"
    volumes:
      # SQLite 파일이 여기 남습니다. 백업은 이 볼륨만 챙기면 됩니다.
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── Cloudflare 터널 ───────────────────────────────────────────────────
  # 기본으로는 안 뜹니다. 켜려면:  docker compose --profile tunnel up -d
  # .env 에 TUNNEL_TOKEN 을 넣어야 합니다 (.env.example 참고)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tokyo-trip-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    networks: [tokyo-net]
    depends_on: [tokyo-trip]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

networks:
  tokyo-net:

volumes:
  api-data:
