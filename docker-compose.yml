services:
  tokyo-trip:
    build: .
    image: tokyo-trip:latest
    container_name: tokyo-trip
    restart: unless-stopped
    ports:
      # 호스트 80번은 이미 다른 컨테이너가 쓰고 있으므로 8080 사용.
      # 리버스 프록시 뒤에 둘 거면 "127.0.0.1:8080:80" 으로 바꿔 외부 노출을 막으세요.
      - "8080:80"

    # ── 지도 키를 서버에 두고 싶을 때만 아래 주석 해제 ──────────────────
    # 키는 이미지에 굽지 않습니다(.dockerignore). 서버에서 직접 만드세요:
    #   cp gmaps-key.local.js.example gmaps-key.local.js && vi gmaps-key.local.js
    # CentOS 는 SELinux 때문에 :ro,Z 가 반드시 필요합니다.
    #
    # volumes:
    #   - ./gmaps-key.local.js:/usr/share/nginx/html/gmaps-key.local.js:ro,Z

    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
